<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock</title>
</head>
<body>
    
    <script>
       
        //console.log("Hello World")

        // FUNCTION to get the Computer choice
        function getComputerChoice(){
            let shoot=Math.floor(Math.random() * 3) + 1;
            
            if(shoot==1){
                return "rock";
            }else if(shoot==2){
                return "paper";
            }else{
                return "scissors";
            }
        }
        // console.log(getComputerChoice());

        //Function to get The User Input
        function getHumanChoice() {
            let choice = prompt("Please choose: rock, paper, or scissors");
                return choice;
}   
// console.log("The human chose: " + getHumanChoice()); 

//Function  for the rounds to be play by the User and computer
function playGame(){
         let humanScore =0;
        let computerScore =0;

        // Function to know the choice of the both of them and decide who wins
        function playRound(humanChoice,computerChoice){
     humanChoice = humanChoice.toLowerCase();

    // 2. Handle a Tie
    if (humanChoice === computerChoice) {
        console.log("It's a tie! Both chose " + humanChoice);
    } 
    
    else if (
        (humanChoice === "rock" && computerChoice === "scissors") ||
        (humanChoice === "paper" && computerChoice === "rock") ||
        (humanChoice === "scissors" && computerChoice === "paper")
    ) {
        humanScore++;
        console.log("You win! " + humanChoice + " beats " + computerChoice);
    } 
   
    else {
        computerScore++;
        console.log("You lose! " + computerChoice + " beats " + humanChoice);
    }

        }
        for(let i=1;i<=5;i++){
            console.log("----ROUND" + i + "----" );
            const humanSelection = getHumanChoice();
            const computerSelection = getComputerChoice();
            playRound(humanSelection, computerSelection);

        }
// 5. Declare the overall winner after the loop finishes
            console.log("=== FINAL SCORE ===");
            console.log("Human: " + humanScore + " | Computer: " + computerScore);
            
            if (humanScore > computerScore) {
                console.log("🎉 YOU WON THE TOURNAMENT! 🎉");
            } else if (computerScore > humanScore) {
                console.log("💀 THE COMPUTER WON THE TOURNAMENT! 💀");
            } else {
                console.log("🤝 IT'S A TIE TOURNAMENT! 🤝");
            }
        }
playGame();




</script>
</body>
</html>
